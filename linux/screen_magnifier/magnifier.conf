# 放大镜配置。以 # 开头的行是说明，程序不读取。
# size_key 保存后，下一次滚轮就按新键。filter_zoom 在下一次改倍率时生效。不必重启。
# 滚轮调过的倍率、直径和阈值会写回下面的值，说明会保留。
#
# hotkey：建议绑到桌面快捷键上的组合。程序不抓取这个键。
#         可用 ctrl、alt、shift、super，用加号连接，例如 ctrl+alt+space。
hotkey=ctrl+alt+space
#
# zoom：放大倍率，范围 1.25 到 6。没按住改大小的键、也没按住 Shift 时，滚轮改这项。
zoom=1.9
#
# diameter：圆的直径，单位像素。最小 96，最大不超过指针所在显示器较短的一边。
diameter=728
#
# filter_zoom：算法阈值，范围 1.25 到 6.25。
#              当前倍率低于它时直接取最近的像素；不低于时横竖保持清晰，斜线才做过渡。
#              1.25 表示始终做边缘判断，6.25 表示始终直接取像素。
#              size_key 不是 shift 时，按住 Shift 滚轮改这项。默认 size_key 是 shift，这时 Shift 只改直径。
filter_zoom=2
#
# size_key：按住这个键再滚轮，改变圆的直径。可选 alt、ctrl、shift、super，默认 shift。
#           保存后下一次滚轮即生效，不必重启。
#           选 ctrl 时，Ctrl+滚轮改直径，不再送给下面的窗口。
#           选别的键时，Ctrl+滚轮仍送给下面的窗口。
size_key=shift
